<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102342">
<title>PLANPROBEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<style>
:root{color-scheme:dark;--bg:#102342;--panel:#243f70;--line:#385987;--text:#f3f7ff;--muted:#b9cbe5;--accent:#69a7e8;--accent2:#3979b9}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(155deg,#18345c,#102342 58%,#0b1a30);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:740px;margin:auto;padding:22px 14px 44px}h1{margin:0 0 8px;font-size:29px;letter-spacing:1.3px}
.card{background:rgba(36,63,112,.92);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 8px 22px #07162b55}
h2{font-size:18px;margin:0 0 14px}.muted,.meta,.note{color:var(--muted)}
.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}
input[type=text],textarea,select{width:100%;background:#142b4d;color:var(--text);border:1px solid #5274a3;border-radius:11px;padding:13px;font:inherit;min-height:48px}
textarea{min-height:72px}.months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.month{background:#19365e;border:1px solid var(--line);border-radius:10px;padding:9px 6px;font-size:13px}
.month input{accent-color:var(--accent)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:600}
.primary{width:100%;background:linear-gradient(120deg,#8fc4f4,#3979b9);color:#071a31;min-height:48px}
.secondary,.tab,.small,.tools button{background:#315584;color:#eff6ff}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0}
.tab{font-size:13px;padding:11px 4px}.tab.active{background:#477db5;outline:1px solid #a9d4ff}
.probe{display:flex;gap:11px;background:#19365e;border:1px solid var(--line);padding:13px;border-radius:14px;margin:9px 0}
.probe>input{width:22px;height:22px;accent-color:var(--accent)}.probe-main{flex:1;min-width:0}
.probe-name{font-weight:650;overflow-wrap:anywhere}.meta{font-size:12px;margin-top:5px}
.desc{font-size:14px;margin-top:7px;white-space:pre-wrap;overflow-wrap:anywhere}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.iconbtn{background:#315584;color:#eaf4ff;font-size:16px;min-width:34px;min-height:32px;padding:5px 8px;border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:22px}.note{font-size:12px;line-height:1.5;margin-top:12px}
.form-toggle{width:100%;background:#315584;color:#fff;text-align:left;margin-top:16px}
.form-card[hidden]{display:none}.count{font-weight:700;color:#b9dcff}
@media(max-width:420px){main{padding:17px 11px}.card{padding:14px}}
</style>
</head>
<body><main>
<header><h1>PLANPROBEN</h1></header>
<button class="form-toggle" id="toggleForm">＋ Neue Probe hinzufügen</button>
<section class="card form-card" id="formCard" hidden>
<h2 id="formTitle">Neue Probe eintragen</h2>
<form id="form">
<div class="field"><label for="name">Name der Probe</label><input id="name" type="text" placeholder="Name der Probe eingeben" autocomplete="off" required></div>
<div class="field"><label for="quarter">Quartal</label><select id="quarter"><option value="Q1">Q1 · Januar–März</option><option value="Q2">Q2 · April–Juni</option><option value="Q3">Q3 · Juli–September</option><option value="Q4">Q4 · Oktober–Dezember</option></select></div>
<div class="field"><label>Monat(e)</label><div class="months" id="months"></div></div>
<div class="field"><label for="details">Details (optional)</label><textarea id="details" placeholder="Zusätzliche Informationen …"></textarea></div>
<button class="primary" id="save">Probe speichern</button> <button type="button" class="secondary" id="cancel" hidden>Abbrechen</button>
</form><div class="note">Eine Probe kann mehreren Monaten zugeordnet werden.</div>
</section>
<nav class="tabs"><button class="tab active" data-view="open">Alle offenen</button><button class="tab" data-view="month">Nach Monat</button><button class="tab" data-view="done">Abgeschlossen</button></nav>
<section class="card"><div id="controls"></div><div id="list"></div></section>
<section class="card"><h2>Datensicherung</h2><div class="actions"><button class="secondary" id="export">Sicherung exportieren</button><button class="secondary" id="import">Sicherung importieren</button><input id="file" type="file" accept=".json,application/json" hidden></div><div class="note">Die Daten werden lokal auf diesem Gerät gespeichert. Exportiere gelegentlich eine Sicherung.</div></section>
</main>
<script>
const M={Q1:['Januar','Februar','März'],Q2:['April','Mai','Juni'],Q3:['Juli','August','September'],Q4:['Oktober','November','Dezember']},K='proben-vs-227-v2';
let data=JSON.parse(localStorage.getItem(K)||'[]'),view='open',month='Januar',editing=null;
const $=x=>document.getElementById(x);
data.forEach(p=>{if(typeof p.order!=='number')p.order=data.indexOf(p);});
function choices(sel=[]){$('months').innerHTML=M[$('quarter').value].map(m=>`<label class="month"><input type="checkbox" value="${m}" ${sel.includes(m)?'checked':''}> ${m}</label>`).join('')}
$('quarter').onchange=()=>choices();choices();
function persist(){localStorage.setItem(K,JSON.stringify(data));render()}
function closeForm(){editing=null;$('form').reset();$('quarter').value='Q1';choices();$('formTitle').textContent='Neue Probe eintragen';$('save').textContent='Probe speichern';$('cancel').hidden=true;$('formCard').hidden=true;$('toggleForm').hidden=false}
$('toggleForm').onclick=()=>{$('formCard').hidden=false;$('toggleForm').hidden=true;$('name').focus()};
$('cancel').onclick=closeForm;
$('form').onsubmit=e=>{e.preventDefault();let months=[...$('months').querySelectorAll('input:checked')].map(x=>x.value),name=$('name').value.trim();if(!name||!months.length){alert('Bitte Namen und mindestens einen Monat angeben.');return}
let p={name,quarter:$('quarter').value,months,details:$('details').value.trim()};
if(editing!==null)data[editing]={...data[editing],...p};else{let max=Math.max(-1,...data.map(x=>Number(x.order)||0));data.push({...p,done:false,order:max+1})}
closeForm();persist()};
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function ordered(){return data.map((p,i)=>({...p,i})).sort((a,b)=>(a.order??a.i)-(b.order??b.i))}
function move(i,dir){let arr=ordered(),pos=arr.findIndex(p=>p.i===i),target=pos+dir;if(target<0||target>=arr.length)return;let a=arr[pos],b=arr[target],v=a.order??pos;a.order=b.order??target;b.order=v;persist()}
function render(){let c=$('controls'),l=$('list'),items=[];c.innerHTML='';
if(view==='open'){c.innerHTML='<h2>Alle offenen Proben</h2>';items=ordered().filter(p=>!p.done)}
else if(view==='done'){c.innerHTML='<h2>Abgeschlossene Proben</h2>';items=ordered().filter(p=>p.done)}
else{let s=document.createElement('select');s.innerHTML=Object.values(M).flat().map(m=>{let n=data.filter(p=>p.months.includes(m)).length;return `<option value="${m}" ${m===month?'selected':''}>${m} (${n})</option>`}).join('');s.onchange=()=>{month=s.value;render()};c.append(s);let n=data.filter(p=>p.months.includes(month)).length;let h=document.createElement('h2');h.innerHTML=`${month} <span class="count">· ${n} Proben</span>`;c.append(h);items=ordered().filter(p=>!p.done&&p.months.includes(month))}
if(!items.length){l.innerHTML='<div class="empty">Hier gibt es noch keine Proben.</div>';return}
l.innerHTML=items.map((p,pos)=>`<article class="probe"><input type="checkbox" data-check="${p.i}" ${p.done?'checked':''} aria-label="Abgeschlossen"><div class="probe-main"><div class="probe-name">${esc(p.name)}</div><div class="meta">${p.quarter} · ${p.months.join(', ')}</div>${p.details?`<div class="desc">${esc(p.details)}</div>`:''}<div class="actions"><button class="iconbtn" data-up="${p.i}" aria-label="Nach oben" title="Nach oben">↑</button><button class="iconbtn" data-down="${p.i}" aria-label="Nach unten" title="Nach unten">↓</button><button class="iconbtn" data-dup="${p.i}" aria-label="Duplizieren" title="Duplizieren">▢</button><button class="iconbtn" data-edit="${p.i}" aria-label="Bearbeiten" title="Bearbeiten">✎</button><button class="iconbtn" data-del="${p.i}" aria-label="Löschen" title="Löschen">⌫</button></div></div></article>`).join('');
l.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{data[+x.dataset.check].done=x.checked;persist()});
l.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{let i=+x.dataset.edit,p=data[i];editing=i;$('name').value=p.name;$('quarter').value=p.quarter;choices(p.months);$('details').value=p.details||'';$('formTitle').textContent='Probe bearbeiten';$('save').textContent='Änderungen speichern';$('cancel').hidden=false;$('formCard').hidden=false;$('toggleForm').hidden=true;scrollTo({top:0,behavior:'smooth'})});
l.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{let i=+x.dataset.del;if(confirm('Diese Probe wirklich löschen?')){data.splice(i,1);persist()}});
l.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(+x.dataset.up,-1));
l.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(+x.dataset.down,1));
l.querySelectorAll('[data-dup]').forEach(x=>x.onclick=()=>{let p=data[+x.dataset.dup],copy={...p,done:false,order:Math.max(-1,...data.map(q=>Number(q.order)||0))+1};data.push(copy);persist()});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));render()});
$('export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({app:'PLANPROBEN',probes:data},null,2)],{type:'application/json'}));a.href=u;a.download='PLANPROBEN-Sicherung.json';a.click();URL.revokeObjectURL(u)};
$('import').onclick=()=>$('file').click();
$('file').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j.probes))throw 0;if(confirm('Vorhandene Daten ersetzen?')){data=j.probes;data.forEach((p,i)=>{if(typeof p.order!=='number')p.order=i});persist();alert('Sicherung wiederhergestellt.')}}catch{alert('Ungültige Sicherungsdatei.')}e.target.value=''};
render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
